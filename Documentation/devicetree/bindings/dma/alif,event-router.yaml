%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/alif,event-router.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ALIF Event Router DMA Controller

maintainers:
  - Aravind Krishnan <aravind.krishnan@alifsemi.com>

description: |
  The ALIF Event Router is a 4:1 multiplexer that routes DMA events from peripherals
  to the DMA controller. It supports 32 DMA channels, with each channel capable
  of being connected to one of 4 peripherals.

properties:
  compatible:
    const: alif,event-router

  reg:
    maxItems: 1
    description: |
      Memory mapped register range for the event router configuration

  "#dma-cells":
    const: 2
    description: |
      First cell is the DMA channel number (0-31)
      Second cell is the peripheral source (0-3)

  dma-masters:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      Phandle to the DMA controller (e.g., PL330) that this router feeds

required:
  - compatible
  - reg
  - "#dma-cells"
  - dma-masters

additionalProperties: false

examples:
  - |
    event_router: dma-router@40000000 {
        compatible = "alif,event-router";
        reg = <0x40000000 0x1000>;
        #dma-cells = <2>;
        dma-masters = <&dma0>;
    };
