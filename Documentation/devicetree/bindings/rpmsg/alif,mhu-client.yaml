$id: "http://devicetree.org/schemas/hwlock/alif,rpmsg.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: ARM MHUv2 RPMSG mailbox Client
description: ARM MHUv2 RPMSG mailbox Client

maintainers:
  - Hemanth.Kumar<hemanth@alifsemi.com>

properties:
  compatible:
    enum:
      - alif,client

  mbox:
    description: |
      List of phandles to mailbox channels used for receiving and
      transmitting data from and to the hardware UART.
    items:
      - description: mailbox for receiving data from hardware UART
      - description: mailbox for transmitting data to hardware UART

   mbox-names:
    items:
      - const: txdb
      - const: rxdb


required:
  - compatible
  - mbox-names
  - mboxes

additionalProperties: false

examples:
  - |
    client {
	compatible = "arm,client";
        mbox-names = 	"txdb0", "txdb1",
			"rxdb0", "rxdb1",
			"txdb2", "txdb3",
			"rxdb2", "rxdb2",
			"txdb4", "txdb5",
			"rxdb4", "rxdb5";
	mboxes 	   =	<&mbox_m55_hp_mhu0_tx 0 0>,
			<&mbox_m55_hp_mhu1_tx 0 0>,
			<&mbox_m55_hp_mhu0_rx 0 0>,
			<&mbox_m55_hp_mhu1_rx 0 0>,
			<&mbox_m55_he_mhu0_tx 0 0>,
			<&mbox_m55_he_mhu1_tx 0 0>,
			<&mbox_m55_he_mhu0_rx 0 0>,
			<&mbox_m55_he_mhu1_rx 0 0>,
			<&mbox_se_mhu0_tx 0 0>,
			<&mbox_se_mhu1_tx 0 0>,
			<&mbox_se_mhu0_rx 0 0>,
			<&mbox_se_mhu1_rx 0 0>;
    };
